<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SIGN UP // DEFIXION</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: #000; font-family: 'Share Tech Mono', monospace; color: #fff; display: flex; align-items: center; justify-content: center; }
  .auth-box { background: rgba(13,0,0,0.85); border: 2px solid #ff1a1a; padding: 40px; width: 100%; max-width: 400px; box-shadow: 0 0 30px rgba(255,26,26,0.2); }
  h1 { color: #ff1a1a; text-transform: uppercase; text-align: center; margin-bottom: 30px; font-size: 28px; letter-spacing: 0.2em; }
  input { width: 100%; background: #000; border: 1px solid #333; padding: 12px; color: #fff; font-family: inherit; font-size: 16px; margin-bottom: 15px; outline: none; }
  input:focus { border-color: #ff1a1a; }
  button { width: 100%; background: #ff1a1a; color: #000; border: none; padding: 14px; font-family: inherit; font-size: 16px; font-weight: bold; text-transform: uppercase; cursor: pointer; transition: 0.2s; margin-bottom: 15px; }
  button:hover { background: #fff; box-shadow: 0 0 20px #fff; }
  .divider { text-align: center; margin: 15px 0; color: #666; font-size: 12px; text-transform: uppercase; }
  .btn-discord { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; background: #5865F2; color: #fff; text-decoration: none; padding: 14px; font-family: inherit; font-size: 16px; font-weight: bold; text-transform: uppercase; transition: 0.2s; }
  .btn-discord:hover { background: #4752c4; box-shadow: 0 0 20px #5865F2; }
  .error { color: #ff1a1a; font-size: 14px; text-align: center; margin-top: 10px; min-height: 18px; }
  .bottom-link { text-align: center; margin-top: 20px; font-size: 14px; color: #666; }
  .bottom-link a { color: #ff1a1a; text-decoration: none; }
</style>
</head>
<body>
  <div class="auth-box">
    <h1>Sign Up</h1>
    <input type="email" id="email" placeholder="EMAIL">
    <input type="text" id="user" placeholder="USERNAME">
    <input type="password" id="pass" placeholder="PASSWORD">
    <button onclick="signup()">Create Account</button>
    
    <div class="divider">— OR —</div>
    
    <a href="/auth/discord" class="btn-discord">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M20.317 4.37a19.79 19.79 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028 14.09 14.09 0 0 0 1.226-1.994.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/></svg>
      Sign Up with Discord
    </a>
    
    <div class="error" id="err"></div>
    <div class="bottom-link" style="margin-top:20px">Already have an account? <a href="/login">Login</a></div>
  </div>
  <script>
    async function signup() {
      const email = document.getElementById('email').value.trim();
      const user = document.getElementById('user').value.trim();
      const pass = document.getElementById('pass').value;
      if (!email || !user || !pass) { document.getElementById('err').textContent = 'FILL ALL FIELDS'; return; }
      document.getElementById('err').textContent = 'CREATING...';
      const res = await fetch('/api/signup', {
        method: 'POST', headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ email, username: user, password: pass })
      });
      if (res.ok) window.location.href = '/';
      else {
        const data = await res.json();
        document.getElementById('err').textContent = data.error.toUpperCase();
      }
    }
  </script>
</body>
</html>
