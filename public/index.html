<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DEFIXION // OSINT</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');
  
  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  html, body { 
    min-height: 100%; 
    background: #000000; 
    font-family: 'Share Tech Mono', monospace; 
    color: #fff; 
    overflow-x: hidden;
  }
  
  /* TOP BANNER */
  .top-banner { 
    width: 100%; 
    display: block; 
    /* Removed max-height so it doesn't crop the wide image */
  }

  /* TOP RIGHT CONTROLS */
  .top-controls {
    position: absolute;
    top: 20px;
    right: 30px;
    display: flex;
    align-items: center;
    gap: 15px;
    z-index: 10;
    background: rgba(0, 0, 0, 0.7);
    padding: 8px 16px;
    border-radius: 4px;
    border: 1px solid rgba(255, 26, 26, 0.3);
  }

  .btn-login, .btn-signup {
    color: #ccc;
    text-decoration: none;
    font-family: 'Share Tech Mono', monospace;
    font-size: 14px;
    text-transform: uppercase;
    transition: 0.2s;
  }
  .btn-login:hover, .btn-signup:hover {
    color: #fff;
    text-shadow: 0 0 10px #fff;
  }

  .divider {
    color: #ff1a1a;
    font-size: 14px;
  }

  .btn-top-right {
    background: #ff1a1a; 
    color: #000; 
    text-decoration: none; 
    padding: 8px 20px; 
    font-weight: bold; 
    font-family: 'Share Tech Mono', monospace;
    font-size: 14px;
    text-transform: uppercase; 
    border: none; 
    cursor: pointer; 
    transition: 0.2s;
  }
  .btn-top-right:hover { 
    background: #fff; 
    box-shadow: 0 0 20px rgba(255,255,255,0.8); 
  }
  
  /* MAIN CONTENT */
  .container { 
    max-width: 1000px; 
    /* Pulls the section up slightly so it overlaps the bottom of the image nicely */
    margin: -50px auto 40px auto; 
    padding: 0 20px; 
    position: relative;
    z-index: 2;
  }
  
  /* HEADER ROW */
  .header-row { 
    display: flex; 
    justify-content: space-between; 
    align-items: flex-end; 
    margin-bottom: 20px; 
    border-bottom: 2px solid #ff1a1a; 
    padding-bottom: 10px; 
  }
  
  .header-row h1 { 
    font-size: 28px; 
    color: #ff1a1a; 
    text-shadow: 0 0 10px rgba(255, 26, 26, 0.5); 
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin: 0;
  }
  
  /* PASTE LIST */
  .paste-list { 
    display: flex; 
    flex-direction: column; 
    gap: 10px; 
  }
  
  .paste-item { 
    background: #0d0000; 
    border: 1px solid #331111; 
    padding: 18px 20px; 
    display: flex; 
    justify-content: space-between; 
    align-items: center; 
    text-decoration: none; 
    color: #ccc; 
    transition: 0.2s; 
    border-left: 3px solid transparent;
  }
  
  .paste-item:hover { 
    border-color: #ff1a1a; 
    border-left-color: #ff1a1a;
    background: #1a0000; 
    color: #fff; 
    transform: translateX(5px);
  }
  
  .paste-title { 
    font-size: 18px; 
    color: #ff1a1a; 
    font-weight: bold;
    word-break: break-all;
  }
  
  .paste-meta { 
    font-size: 12px; 
    color: #666; 
    text-align: right;
    letter-spacing: 0.05em;
  }
</style>
</head>
<body>

  <!-- Top Right Controls -->
  <div class="top-controls" id="topControls">
    <a href="/login" class="btn-login">Login</a>
    <span class="divider">|</span>
    <a href="/signup" class="btn-signup">Sign Up</a>
    <a href="/create" class="btn-top-right">+ New Paste</a>
  </div>

  <!-- Top Banner Image -->
  <img src="https://files.catbox.moe/wi4qyi.webp" class="top-banner" alt="Defixion">

  <!-- Main Content -->
  <div class="container">
    <div class="header-row">
      <h1>Recent Pastes</h1>
      <div></div>
    </div>
    
    <!-- The list where pastes are loaded -->
    <div class="paste-list" id="list">
      <div style="color:#666; text-align:center; padding: 20px;">Loading pastes...</div>
    </div>
  </div>

  <script>
    // Auth Check (changes buttons if logged in)
    fetch('/api/me').then(r => {
      if (r.ok) {
        document.getElementById('topControls').innerHTML = `
          <span style="color:#ff1a1a; font-weight:bold; margin-right: 15px;">LOGGED IN</span>
          <a href="/create" class="btn-top-right" style="margin-right:15px">+ New Paste</a>
          <button onclick="logout()" class="btn-login" style="background:none; border:none; cursor:pointer; font-family:inherit; font-size:14px;">Logout</button>
        `;
      }
    });

    // Fetch recent pastes
    fetch('/api/pastes/recent')
      .then(r => r.json())
      .then(data => {
        const list = document.getElementById('list');
        
        if (data.length === 0) { 
          list.innerHTML = '<div style="color:#666; text-align:center; padding: 20px;">No pastes found. Click + New Paste to create one.</div>'; 
          return; 
        }
        
        list.innerHTML = data.map(p => `
          <a href="/view/${p.id}" class="paste-item">
            <div class="paste-title">${p.title}</div>
            <div class="paste-meta">BY ${p.author.toUpperCase()} <br> ${new Date(p.date).toLocaleDateString()}</div>
          </a>
        `).join('');
      })
      .catch(() => {
        document.getElementById('list').innerHTML = '<div style="color:#ff1a1a; text-align:center;">Failed to connect to database.</div>';
      });

    async function logout() { 
      await fetch('/api/logout', {method:'POST'}); 
      location.reload(); 
    }
  </script>
</body>
</html>
